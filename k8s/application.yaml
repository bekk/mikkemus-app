# Eksempel på skiperator Application-manifest for mikkemus-app.
# Bytt ut <ditt-registry-image> og ingress-hostnavnet før du bruker denne.
# Se eurocloud-repoet for hvordan dere setter opp registry/bygg av image.
apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: mikkemus-weba
  namespace: mikkemus
spec:
  image: "ghcr.io/ahmedabdulahi/mikkemus-webatest:latest"
  port: 8080
  replicas: 2

  ingresses:
    - mikkemusa

  liveness:
    path: /
    port: 8080

  readiness:
    path: /
    port: 8080

  envFrom:
    - secret: mikkemus-db
    - secret: mikkemus-blob
    - secret: mikkemus-secrets

  resources:
    requests:
      cpu: 25m
      memory: 128M
    limits:
      memory: 512M
