
# Engangsjobb som synkroniserer Prisma-schemaet (`prisma db push`) mot
# databasen. Kjøres fra inni klyngen siden databasen kun er nåbar privat.
#
# Kjør på nytt hver gang schema.prisma endres:
#   kubectl delete -f k8s/migrate-job.yaml --ignore-not-found
#   kubectl apply -f k8s/migrate-job.yaml
#   kubectl logs -n mikkemus job/mikkemus-migrate -f
apiVersion: skiperator.kartverket.no/v1beta1
kind: SKIPJob
metadata:
  name: mikkemus-migrate
  namespace: mikkemus
spec:
  job:
    backoffLimit: 0
    ttlSecondsAfterFinished: 300

  image: "ghcr.io/ahmedabdulahi/mikkemus-web:migrate"

  # Databasetilgangen gis av plattformen, som for mikkemus.yaml.
  envFrom:
    - secret: mikkemus-db
